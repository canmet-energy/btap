[build-system]
# >=77 for the SPDX `license` string + `license-files`, which is
# what actually puts the LICENSE into the built wheel.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canmet-btap"  # PyPI similarity check blocks "btap" (bta exists); the import stays `btap`
# 0.4.0a1: an ALPHA (phylroy, 2026-11-19) — the command line, the Python API
# and report.json may still change between releases, and saying so is the
# point. A PEP 440 pre-release, so pip skips it unless asked: a plain
# `pip install canmet-btap` keeps installing 0.3.0, and the alpha needs
# `pip install --pre canmet-btap`. Installs from GitHub are unaffected.
# The version must agree with btap.__version__ and the installer's
# AppVersion (packaging/windows/release_guards.py).
version = "0.4.0a1"
description = "NECB 2020/2025 Part 8 performance-path compliance toolchain (Python port of the btap gem family)"
# The PyPI long description stays src/README.md; the root README.md is
# for building engineers (CLAUDE.md), a different audience.
readme = "src/README.md"
classifiers = [
  # Shown on PyPI: the CLI, the Python API and report.json may change.
  "Development Status :: 3 - Alpha",
]
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# The wheel must CARRY the licence, not merely name it: the Windows
# installer redistributes this package, and a metadata field is a
# claim while a shipped notice is what satisfies the obligation.
license-files = ["LICENSE"]
# The SDK: same SWIG layer as the Ruby gems, published on PyPI by NREL.
# btap.audit needs none of it; simulation/modeling/costing/necb do.
# canmet-energyplus (R5, D-83): the pinned EnergyPlus engine as package
# data — a HARD platform-marked EXACT pin, so `pip install btap` needs no
# engine thought on the supported platforms (Windows x86-64; glibc-2.35+
# Linux x86-64 — the floor the companion's build-time auditwheel gate
# enforces on every build; see packaging/pypi/energyplus). Exact
# (==25.2.0.2, never
# .*): a companion repackaging REQUIRES a corresponding btap release.
# Other platforms skip the marker and fall to the provisioner's
# override/archive/download rungs.
dependencies = [
  "openstudio~=3.11.0",
  "canmet-energyplus==25.2.0.2 ; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
  # NECB 3.1.1.7 thermal bridging. A DEFAULT dependency since D-109
  # (phylroy, 2026-11-14): as an extra, the people who needed it most — anyone
  # determining compliance — were the least likely to know to add `[tbd]`,
  # and without it every determination's reference envelope is under-insulated
  # relative to the Code's intent. D-83 rejected an `[engine]` extra for
  # canmet-energyplus on exactly that ground ("pip has no default extras");
  # this applies the same reasoning to the other engine.
  #
  # Released pin since R5 (D-83): canmet-tbd 3.5.2 — PyPI blocked the py-tbd
  # name as too similar to pytbd/tbd — IS the pinned verification tree bfb23e6
  # plus one diff-proven metadata-only commit (its v3.5.2 tag), published from
  # canmet-energy/py-tbd; py-topolys==0.1.0 rides transitively (its v0.1.0 tag
  # sits at exactly the D-79 pinned SHA). There is no `[tbd]` extra any more:
  # it was removed rather than kept empty, since nothing outside this
  # repository depended on it (phylroy, 2026-11-14: no clients yet).
  #
  # Pure Python (py3-none-any, as is py-topolys), so unlike the EnergyPlus
  # companion it needs no platform marker. The pin is EXACT and must match
  # `PINNED_TBD_VERSION` in btap/codes/necb/envelope/thermal_bridging.py —
  # upstream 3.6.x changes the physics by ~43% on the same wall, so an upgrade
  # is an adjudicated rebaseline, never routine maintenance.
  "canmet-tbd==3.5.2",
]

# NECB 3.1.1.7 thermal bridging (M7, D-79 Option A): py-tbd's
# tbd-3.5.2-compat branch — the revision verified against the SAME Ruby
# TBD 3.5.2 / OSut 0.8.2 oracle baseline the family is frozen on (py-tbd
# main ports 3.6.0, a physically different uprate). Pinned by COMMIT SHA on
# both py-tbd and (transitively, inside py-tbd's own pyproject) py-topolys:
# neither has a tagged release yet, and an unpinned git ref would let the
# verification baseline move without a commit here.
# tests/necb/test_envelope_thermal_bridging.py asserts the installed engine
# identity; BTAP_TBD_REQUIRED=1 turns its absence from a skip into a failure.

[project.scripts]
btap-compliance = "btap.codes.cli:main"
btap-necb-coverage = "btap.codes.coverage:main"

# #229: the standard src layout. This file is at the repository root, so
#   pip install git+https://github.com/canmet-energy/btap
# works with no `#subdirectory=`, and the package is under src/ so that a
# checkout's root never shadows the installed `btap` on sys.path. tests/ and
# scripts/ sit beside this file. See docs/plans/PYTHON_PACKAGE_LAYOUT_PLAN.md.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["btap*"]

# The rules/catalog/cost tables are the product, not incidental assets: every
# domain reads them by path at runtime, so a wheel without them fails on the
# first call. setuptools ships only .py by default — verified by building one
# and finding zero data files in it. Keep this in step with any new data dir.
#
# The costing CSVs here are the PLACEHOLDER schema copies (source column:
# placeholder/custom/industry — never RS-Means), and they DO belong in the
# wheel: a wheel is the analogue of the Ruby GEM, whose spec.files ships
# them, not of the Windows INSTALLER, which strips them via the Rakefile's
# PRICED_CSVS. Anyone building an end-user Python installer later should
# mirror that exclusion there, not here. Real RS-Means values are
# runtime-injected (costs_csv= / BTAP_COSTING_DIR) and never live in the tree.
[tool.setuptools.package-data]
"*" = ["data/**/*.json", "data/**/*.csv", "data/**/*.md", "data/**/*.osm"]

[tool.ruff]
# `src` makes ruff's isort rules classify `btap` (under src/) and `tests`
# (at the root) as FIRST-party; without both, import-block sorting changes.
src = ["src", "."]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforced in CI, so the selection is what this codebase can honestly hold:
#   E4/E7/E9 + F + B + I — real defects, bugbear traps, import hygiene.
# Deliberately NOT enabled:
#   E501 (line length) — the port mirrors Ruby's line structure; reflowing
#     ~745 lines would bury the port diff in noise for no defect caught.
#   UP  (pyupgrade)    — it rewrites %-formatting to f-strings, and the
#     audit narrative's "[%-8s] %-13s %s" is deliberate BYTE-PARITY with
#     Ruby's format(). Auto-modernizing it would silently break the report's
#     case-sensitive checklist parsing.
select = ["E4", "E7", "E9", "F", "B", "I"]
# Ruby's Array#zip PADS the shorter side with nil; Python's zip truncates and
# strict=True raises. Neither matches, and the ported code handles length
# mismatch explicitly where it matters — a blanket strict= would diverge.
ignore = ["B905"]

[tool.pytest.ini_options]
# Relative to THIS file; run pytest from the repository root.
testpaths = ["tests"]
# THIS checkout's `btap` leads sys.path, ahead of any installed copy. Strict
# src-layout practice tests only the installed package, but an editable
# install of ANOTHER checkout (a worktree's venv pointing at the main tree)
# would then be what the suite exercises, silently. Explicit is safer here.
pythonpath = ["src"]
# #236's single-zone warning, and ONLY it: some 100 tests build a "PSZ RTU ..."
# row across the fixture's 5 zones on purpose, to exercise the shared build the
# warning describes. tests/modeling/test_build_system_facade.py records it
# explicitly (simplefilter "always"), so the warning itself stays tested.
filterwarnings = [
  "ignore:ONE shared .* unit now serves:UserWarning",
]

# The D-77 one-way dependency arrows, enforced in-package (one distribution,
# five subpackages): necb -> costing -> modeling -> audit; simulation beside.
[tool.importlinter]
root_package = "btap"
# Required because the audit contract forbids an EXTERNAL module (openstudio).
include_external_packages = true

# btap.stock sits BESIDE btap.codes: both consume btap.modeling and neither
# imports the other. The sibling syntax ("a | b") makes them independent at the
# same layer, so "stock may import modeling; modeling may NOT import stock"
# holds, and so does "stock may not import codes".
[[tool.importlinter.contracts]]
name = "family dependency direction (D-77)"
type = "layers"
layers = ["btap.codes | btap.stock", "btap.costing", "btap.modeling", "btap.audit"]

[[tool.importlinter.contracts]]
name = "simulation depends only on audit"
type = "forbidden"
source_modules = ["btap.simulation"]
forbidden_modules = ["btap.modeling", "btap.costing", "btap.codes"]

# Stage 9a of the multi-edition plan: the determination lifecycle is
# code-family-NEUTRAL. A code family (btap.codes.necb, and later an OBC or BC
# Step Code sibling) may import btap.codes — the pipeline, the registry, the
# report — but the pipeline reaches a family ONLY through the registry
# (`Ruleset.path()`), never by importing one. Indirect chains count: a route
# through btap.codes.compliance would put every NECB module back inside the
# neutral lifecycle's import graph.
[[tool.importlinter.contracts]]
name = "the neutral pipeline never imports a code family"
type = "forbidden"
source_modules = ["btap.codes.pipeline"]
forbidden_modules = ["btap.codes.necb"]

[[tool.importlinter.contracts]]
name = "audit is SDK-free and bottom of the family"
type = "forbidden"
source_modules = ["btap.audit"]
forbidden_modules = ["openstudio", "btap.simulation", "btap.modeling", "btap.costing", "btap.codes"]
