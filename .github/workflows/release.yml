name: release

# Pushing a v* tag builds the Windows installer and publishes it as a GitHub
# release. workflow_dispatch is the REHEARSAL: the same build end to end, but
# the publish step runs under DRY_RUN with the tag derived from the .iss
# AppVersion — a full exercise that creates nothing outward-facing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # Since R5 (D-83) the payload is a pre-installed Python site-packages tree,
  # so staging needs NO OpenStudio container and no Windows machine: every
  # dependency publishes a wheel, and pip's cross-platform flags resolve the
  # win_amd64 set from a bare Linux runner. The nrel container is gone.
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: build the canmet-btap wheel
        run: |
          pip install -q build
          python3 -m build --wheel --outdir dist .
      - name: generate the sample models
        # Gitignored and generated, not committed — they need the SDK, which
        # is a pip install on linux now that nothing here uses the container.
        run: |
          pip install -q "openstudio~=3.11.0"
          python3 scripts/generate_samples.py packaging/windows/samples
          ls packaging/windows/samples | head -3
      - name: stage the Windows payload
        run: |
          V=$(sed -n 's/#define AppVersion *"\(.*\)"/\1/p' packaging/windows/btap-compliance.iss)
          echo "staging version $V"
          python3 packaging/windows/stage_python.py --version "$V"
      - name: release guards
        run: |
          V=$(sed -n 's/#define AppVersion *"\(.*\)"/\1/p' packaging/windows/btap-compliance.iss)
          python3 packaging/windows/release_guards.py --version "$V"
      - name: installer smoke (structure)
        run: python3 packaging/windows/installer_smoke.py
      - name: tar the staged tree
        # upload-artifact drops the exec bit; a tar preserves the tree exactly.
        run: tar czf stage.tar.gz -C packaging/windows stage
      - uses: actions/upload-artifact@v6
        with:
          name: stage
          path: stage.tar.gz
          retention-days: 7
          if-no-files-found: error

  # The payload is Windows binaries, so only a Windows runner can prove it
  # RUNS. This is the H-9 control: the tree is copied out of the checkout
  # first, because running it in place would let a relative path resolve
  # against the repository and prove nothing about what a recipient gets.
  smoke-windows:
    needs: stage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: stage
      - name: unpack the staged tree
        shell: bash
        run: tar xzf stage.tar.gz -C packaging/windows && rm stage.tar.gz
      - name: installer smoke (executed, checkout absent)
        shell: bash
        run: python packaging/windows/installer_smoke.py --full

  installer:
    needs: [stage, smoke-windows]
    # NATIVE Inno Setup on Windows (#233). The .iss was always written for
    # Windows — backslash paths, and its header documents `iscc` — and ISCC
    # under Wine on Linux was only a way to run it from an ubuntu runner. That
    # broke three times: 22.04's apt wine 6.0.3 could not run the IS6
    # installer, winehq's wine 11 died loading kernel32 in a headless prefix,
    # and in 2026-11 the amake/innosetup image (unchanged since 2026-02) began
    # failing with `wineserver: socket: Function not implemented` once
    # ubuntu-latest moved under it. The runner image ships Inno Setup 6.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: stage
      - name: unpack the staged tree
        run: tar xzf stage.tar.gz -C packaging/windows && rm stage.tar.gz
      - name: compile the installer (native ISCC)
        # The runner image's Inno Setup, located rather than assumed on PATH.
        # Major version 6 is REQUIRED: the script uses IS6 directives
        # (`x64compatible`, `WizardStyle=modern`). The exact version is
        # printed into the log rather than pinned, because pinning a patch
        # release would break on every runner-image update.
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -x "$ISCC" || ISCC=$(command -v iscc || command -v ISCC || true)
          test -n "$ISCC" && test -x "$ISCC" || {
            echo "Inno Setup 6 (ISCC.exe) not found on this runner"; exit 1; }
          BANNER=$("$ISCC" /? 2>&1 | head -3 | tr -d '\r' || true)
          echo "$BANNER"
          echo "$BANNER" | grep -qE "Inno Setup [^0-9]*6\." || {
            echo "Inno Setup 6 required by btap-compliance.iss"; exit 1; }
          mkdir -p packaging/windows/Output
          "$ISCC" packaging/windows/btap-compliance.iss
          ls -la packaging/windows/Output/
      - name: publish (tag push) or rehearse (dispatch, DRY_RUN)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(sed -n 's/#define AppVersion *"\(.*\)"/\1/p' packaging/windows/btap-compliance.iss)
          EXE="packaging/windows/Output/btap-compliance-setup-$V.exe"
          test -f "$EXE" || { echo "no installer at $EXE"; exit 1; }
          echo "built $(basename "$EXE") ($(du -h "$EXE" | cut -f1))"
          if [ "${{ github.event_name }}" = push ]; then
            TAG="${GITHUB_REF_NAME}"
            test "$TAG" = "v$V" || {
              echo "tag $TAG does not match the iss AppVersion v$V"; exit 1; }
            gh release create "$TAG" "$EXE" --title "$TAG" --generate-notes \
              || gh release upload "$TAG" "$EXE" --clobber
          else
            echo "DRY RUN: would publish $EXE as release v$V"
          fi
