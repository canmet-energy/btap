name: release

# Pushing a v* tag builds the Windows installer and publishes it as a GitHub
# release. workflow_dispatch is the REHEARSAL: the same build end to end, but
# the publish step runs under DRY_RUN with the tag derived from the .iss
# AppVersion — a full exercise that creates nothing outward-facing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # Staging needs the OpenStudio SDK (generate_samples.rb requires
  # 'openstudio'), so it runs in the same container as the test matrix. The
  # ISCC compile needs apt + the i386 architecture, which the container job
  # cannot have — hence two jobs, handing over a TARRED tree because
  # upload-artifact drops the exec bit on exe/necb-compliance.rb.
  stage:
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    container: nrel/openstudio:3.11.0
    steps:
      - uses: actions/checkout@v4
      - name: fetch the Windows OpenStudio 3.11.0
        # The same tarball packaging/windows/README.md documents: NREL ships
        # it alongside the .exe installer and it unpacks cleanly on Linux.
        run: |
          # -o, not -O: -O names the file by the URL's percent-encoded basename
          # (%2B stays literal), and the tar below looks for the '+' spelling.
          curl -sSL -o 'OpenStudio-3.11.0+241b8abb4d-Windows.tar.gz' https://github.com/NREL/OpenStudio/releases/download/v3.11.0/OpenStudio-3.11.0%2B241b8abb4d-Windows.tar.gz
          tar xzf 'OpenStudio-3.11.0+241b8abb4d-Windows.tar.gz'
      - name: stage the payload tree
        run: rake windows:stage OPENSTUDIO_WINDOWS="$PWD/OpenStudio-3.11.0+241b8abb4d-Windows"
      - name: tar the staged tree
        run: tar czf stage.tar.gz -C packaging/windows stage
      - uses: actions/upload-artifact@v4
        with:
          name: stage
          path: stage.tar.gz
          retention-days: 1

  package:
    needs: stage
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage
      - name: unpack the staged tree
        run: tar xzf stage.tar.gz -C packaging/windows
      - name: compile the installer (containerized ISCC)
        # Three rehearsals proved apt wine is a moving target here: 22.04's
        # wine 6.0.3 cannot run the IS6 installer at all, and winehq's wine 11
        # dies loading kernel32 in a headless prefix. The amake/innosetup
        # image wraps a known-good ISCC-under-wine; ISCC resolves the .iss's
        # relative paths against the .iss directory, so a repo-root mount is
        # all it needs. The rake task remains the local path
        # (.devcontainer/setup.sh --wine).
        run: |
          docker run --rm -v "$PWD:/work" amake/innosetup:latest packaging/windows/necb-compliance.iss
          ls -la packaging/windows/Output/
      - name: install ruby for the release task
        run: |
          command -v ruby >/dev/null && command -v rake >/dev/null || {
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ruby rake
          }
      - name: publish (tag push) or rehearse (dispatch, DRY_RUN)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          command -v gh >/dev/null || {
            curl -sSL -o /tmp/gh.tgz https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz
            sudo tar xzf /tmp/gh.tgz -C /usr/local/bin --strip-components=2 gh_2.63.2_linux_amd64/bin/gh
          }
          if [ "${{ github.event_name }}" = push ]; then
            rake "windows:release[${GITHUB_REF_NAME}]"
          else
            TAG="v$(sed -n 's/#define AppVersion *"\(.*\)"/\1/p' packaging/windows/necb-compliance.iss)"
            DRY_RUN=1 rake "windows:release[$TAG]"
          fi
