# Publish canmet-btap. Same-bytes promotion in ONE run: build once,
# validate the exact artifact on BOTH platforms a user installs on,
# rehearse on TestPyPI, prove the index serves what this run built, then
# promote those identical files behind a protected approval. Production
# never re-invokes the builder.
#
# The EnergyPlus companion (canmet-energyplus) is NOT built here any more —
# it is published from canmet-energy/canmet-energyplus and consumed like any
# other pinned dependency, which is also what the validate jobs below
# exercise.
name: Publish

on:
  workflow_dispatch:
    inputs:
      mode:
        description: build-only rehearses everything; publish uploads
        required: true
        default: build-only
        type: choice
        options: [build-only, publish]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the distribution ONCE
        run: |
          pip install -q build
          python3 -m build --outdir dist/ python/
          ls -la dist/
      - name: The upload set is exactly the wheel and the sdist
        run: |
          cd dist
          got=$(ls -1 *.whl *.tar.gz | sort | tr '\n' ' ')
          echo "would upload: $got"
          test "$(ls -1 *.whl *.tar.gz | wc -l)" -eq 2 \
            || { echo "expected wheel + sdist, got $got"; exit 1; }
      - name: Digest manifest (the identity every later stage re-verifies)
        run: cd dist && sha256sum *.whl *.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Both validate jobs install the built wheel EXACTLY as a user would —
  # from the index for every dependency, including the companion. The
  # windows one is the only place in this repository where btap executes on
  # Windows at all, so it is not optional.
  validate-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - name: Digest re-verification
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Installed-pair REAL sizing (linux)
        run: |
          python3 -m venv /tmp/v && . /tmp/v/bin/activate
          pip install -q "openstudio~=3.11.0" "$(ls dist/canmet_btap-*.whl)[tbd]"
          python3 -c "
          import canmet_energyplus, btap
          print('companion', canmet_energyplus.ENERGYPLUS_VERSION, '| btap', btap.__version__)"
          mkdir -p /tmp/run
          XDG_CACHE_HOME=/tmp/cache btap-compliance \
            verification/oracle/fixtures/5ZoneNoHVAC.osm --simulate sizing \
            --epw python/tests/fixtures/weather/CAN_ON_Toronto.Intl.AP.716240_CWEC2020.epw \
            --hdd 3890 --storeys 1 --no-report --quiet \
            --space-type "Space Function/Office enclosed > 25 m2" -o /tmp/run || test $? -eq 6
          test -d /tmp/run/proposed_sizing
          provisioned=$(find /tmp/cache -name 'energyplus*' 2>/dev/null | head -1)
          test -z "$provisioned" \
            || { echo "the cache holds $provisioned — the companion did NOT supply the engine"; exit 1; }
          echo "linux installed-pair sizing ok (companion-supplied engine, empty cache)"

  validate-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - name: Digest re-verification
        shell: bash
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Installed-pair REAL sizing (windows)
        shell: bash
        run: |
          python -m venv /tmp/v
          /tmp/v/Scripts/pip install -q "openstudio~=3.11.0" "$(ls dist/canmet_btap-*.whl)[tbd]"
          /tmp/v/Scripts/python -c "
          import canmet_energyplus, btap
          print('companion', canmet_energyplus.ENERGYPLUS_VERSION, '| btap', btap.__version__)"
          mkdir -p /tmp/run
          LOCALAPPDATA='/tmp/cache' /tmp/v/Scripts/btap-compliance \
            verification/oracle/fixtures/5ZoneNoHVAC.osm --simulate sizing \
            --epw python/tests/fixtures/weather/CAN_ON_Toronto.Intl.AP.716240_CWEC2020.epw \
            --hdd 3890 --storeys 1 --no-report --quiet \
            --space-type "Space Function/Office enclosed > 25 m2" -o /tmp/run || test $? -eq 6
          test -d /tmp/run/proposed_sizing
          echo "windows installed-pair sizing ok (companion-supplied engine)"

  publish-testpypi:
    if: inputs.mode == 'publish'
    needs: [validate-linux, validate-windows]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/canmet-btap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - name: Digest re-verification + dependency refusal gate
        run: |
          cd dist && sha256sum -c SHA256SUMS
          # dist/ must hold ONLY distributions: the action uploads whatever
          # it finds and twine rejects a manifest by format.
          rm -f SHA256SUMS
          extra=$(ls -1 | grep -vE '\.(whl|tar\.gz)$' || true)
          test -z "$extra" || { echo "non-distribution files in dist/: $extra"; exit 1; }
          cd ..
          # REFUSE to publish while a hard dependency is unresolvable.
          for dep in "canmet-tbd 3.5.2" "py-topolys 0.1.0" "canmet-energyplus 25.2.0.2"; do
            set -- $dep
            pip index versions "$1" 2>/dev/null | grep -q "$2" \
              || { echo "$1 $2 is not on PyPI — publish upstream first"; exit 1; }
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    if: inputs.mode == 'publish'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: What TestPyPI serves must be byte-identical to what we built
        run: |
          V=$(ls dist/canmet_btap-*.whl | sed -E 's/.*canmet_btap-([^-]+)-py3.*/\1/')
          echo "this run built version $V"
          mkdir -p /tmp/dl
          pip download -q --no-deps -d /tmp/dl \
            --index-url https://test.pypi.org/simple/ "canmet-btap==$V"
          for f in /tmp/dl/*; do
            want=$(grep " $(basename $f)\$" dist/SHA256SUMS | cut -d' ' -f1)
            got=$(sha256sum "$f" | cut -d' ' -f1)
            test -n "$want" || { echo "$(basename $f) is not in the build manifest"; exit 1; }
            test "$want" = "$got" || { echo "$(basename $f): index $got != built $want"; exit 1; }
            echo "identical: $(basename $f)"
          done
          echo "TestPyPI serves exactly the bytes this run built"
      - name: Install from TestPyPI alone (canmet) + PyPI (third-party)
        run: |
          V=$(ls dist/canmet_btap-*.whl | sed -E 's/.*canmet_btap-([^-]+)-py3.*/\1/')
          python3 -m venv /tmp/tv && . /tmp/tv/bin/activate
          pip install -q --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ "canmet-btap[tbd]==$V"
          python3 - "$V" <<'PY'
          import sys
          import btap, canmet_energyplus, tbd
          print("btap", btap.__version__, "| companion",
                canmet_energyplus.ENERGYPLUS_VERSION, "| tbd", tbd.VERSION)
          assert btap.__version__ == sys.argv[1], (btap.__version__, sys.argv[1])
          print("the version installed from the index IS this run's")
          PY

  publish-pypi:
    if: inputs.mode == 'publish'
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canmet-btap
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: distributions, path: dist/}
      - name: Digest re-verification (the SAME bytes the rehearsal proved)
        run: |
          cd dist && sha256sum -c SHA256SUMS
          rm -f SHA256SUMS
          extra=$(ls -1 | grep -vE '\.(whl|tar\.gz)$' || true)
          test -z "$extra" || { echo "non-distribution files in dist/: $extra"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
