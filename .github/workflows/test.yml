name: test

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', 'packaging/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'packaging/**']
  workflow_dispatch:
    inputs:
      export_goldens:
        description: 'Also export the Leg-C oracle goldens as an artifact (D-78)'
        type: boolean
        default: false

# A superseded run is pure waste: pushing twice to a PR used to bill both runs
# in full. Cancel the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The nrel/openstudio image ships without a UTF-8 locale, so Ruby's default
# external encoding is US-ASCII and any File.read of the gems' own output
# (plan_svg.rb emits em dashes, 'm²' and ellipses; the decisions doc is full of
# them) raises "invalid byte sequence in US-ASCII". This is an environment gap,
# not a product defect — the gems write correct UTF-8 and every developer
# machine has a UTF-8 locale. Make CI match rather than diverge from it.
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # Pure-Ruby checks: no OpenStudio SDK, so they run on a bare runner in seconds
  # and fail fast before anything pays for the container.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
      - name: Rule-key orphan lint
        run: ruby btap-necb/scripts/necb_orphan_keys.rb
      # btap-audit is the one gem with no SDK dependency at all (json +
      # minitest). The decisions-registry drift test looks SDK-free but is not:
      # it `require`s every gem's facade to prove their AuditLog resolves to the
      # shared class, so it lives in the `verify` job's container.
      - name: AuditLog is SDK-free and fast
        run: cd btap-audit && ruby test/test_audit.rb
      # The coverage manifests' code refs ("where is this sentence dealt with")
      # are pure JSON + file reads — lint them here so a rename that strands a
      # pointer fails before anything pays for the container.
      - name: Coverage code refs resolve
        run: cd btap-necb && ruby test/test_coverage_code_refs.rb
      # NECB_GEM_COVERAGE.md and NECB_8_4_COVERAGE.html are GENERATED from the
      # gems' article_coverage manifests, and they are what an AHJ reads. Nothing
      # made the committed copies track the manifests, so they drifted: an
      # article promoted partial -> implemented (8.4.4.12 economizers, D-62) kept
      # showing as a gap. Regenerate and demand a clean tree — same contract the
      # decisions registry gets, in the direction a doc can silently rot.
      #
      # Both generators are pure Ruby (json + date), so they belong here rather
      # than in the container. They are deterministic ONLY because BRANCH is a
      # literal — do not restore `git rev-parse` in generate_necb_8_4_coverage.rb
      # or this check fails on every branch that is not main.
      - name: Coverage docs match the manifests
        run: |
          ruby btap-necb/scripts/generate_necb_gem_coverage.rb
          ruby btap-necb/scripts/generate_necb_8_4_coverage.rb
          git diff --exit-code -- btap-necb/docs/NECB_GEM_COVERAGE.md \
                                  btap-necb/docs/NECB_8_4_COVERAGE.html \
            || { echo "::error::Coverage docs are stale. Run: rake necb:coverage_doc"; exit 1; }
      # The decisions registry is CANONICAL on the Python side since R3 (D-81);
      # the Ruby gem's copy is GENERATED from it. Stdlib-only, every PR.
      - name: "Decisions registry: generation direction + citations + TOC"
        run: |
          python3 python/scripts/sync_decisions_registry.py --check
          ruby btap-necb/scripts/generate_decisions_toc.rb --check
          cd python && python3 -m unittest \
            tests.necb.test_decisions_registry_sync \
            tests.necb.test_decisions_registry

  # The Python port (D-79): unittest over python/ — the ported subpackages'
  # suites plus the audit cross-language gate (Python AuditLog vs the Ruby
  # gem, diffed under verification/compare_runs.py's Leg-B rules). Bare
  # runner, runs on every PR. The wheel is REQUIRED here so the SDK-dependent
  # suites can never silently skip; the EnergyPlus-dependent tests DO skip on
  # this runner (no engine, no openstudio CLI) — the `verify` job runs the
  # whole suite with everything required, cross-language simulation included.
  python:
    # Same AWS switch as the container jobs. This job is no longer the ~40 s
    # it was at M1: the wheel gate, ruff and the full suite put it near six
    # minutes, and on a private repo those are BILLED GitHub minutes. With
    # vars.CI_RUNNER set it runs on CodeBuild instead; unset reverts to
    # GitHub-hosted with no workflow edit. No `container:` here on purpose —
    # the point of this job is a bare environment that installs the wheel.
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # the project floor; local dev may be newer
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
      - name: Install the openstudio wheel + test runner
        run: pip install -q 'openstudio~=3.11.0' pytest pytest-xdist import-linter ruff build
      # M7 (D-79 Option A): the pinned py-tbd engine — SDK-only, so its
      # gates run on this bare runner too (the Ruby-vs-Python TBD gates need
      # the Ruby gem and run in verify). Pinned by SHA in pyproject's [tbd]
      # extra; installed here the same way so the pin is the single source.
      - name: Install the pinned py-tbd engine (the [tbd] extra)
        working-directory: python
        run: pip install -q "$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['tbd'][0])")"
      # The D-77 dependency arrows as an enforced contract, not a convention:
      # necb -> costing -> modeling -> audit, simulation beside, and audit
      # SDK-free (the property the bare-runner audit suite depends on). It
      # has already caught real drift — a lazily-imported SDK helper that had
      # crept into the stdlib-only _compat module.
      - name: Import contracts (D-77 direction, audit SDK-free)
        working-directory: python
        run: lint-imports
      # pytest-xdist runs test files in parallel worker PROCESSES (the same
      # per-file forking the Ruby Rakefile does) — the suites are stdlib
      # unittest classes, collected by pytest unchanged; plain
      # `python3 -m unittest discover tests` remains the zero-install way.
      - name: Ruff (the lint policy in pyproject is enforced, not decorative)
        working-directory: python
        run: ruff check .
      - name: Python suites (SDK required, engine tests skip here)
        working-directory: python
        env:
          BTAP_SDK_REQUIRED: '1'
          BTAP_TBD_REQUIRED: '1'
          # D-80 R4: the frozen-scenario python lane (default) rides this
          # pytest run; missing baselines are a FAILURE, never a skip.
          BTAP_SCENARIOS_REQUIRED: '1'
        run: pytest -n auto -q tests/
      # D-82: the dormant Leg-B test files must keep IMPORTING (an
      # import/collection canary only — behavioral rot until R6 deletion
      # is accepted and adjudicated in D-82; BTAP_LEGB=1 reactivates).
      - name: Dormant Leg-B files still collect (import canary)
        working-directory: python
        run: |
          pytest -q --collect-only -p no:cacheprovider \
            tests/audit/test_cross_language.py \
            tests/simulation/test_local_run.py \
            tests/necb/test_envelope_thermal_bridging.py > /dev/null
      # Distribution integrity. The suites above run against the CHECKOUT,
      # where every data file exists because the repo exists; a wheel is a
      # different artifact. This builds one, installs it into a clean venv,
      # and exercises it from OUTSIDE the checkout so the source tree cannot
      # shadow the install. It exists because catalog_html() once resolved
      # its seed model outside the package and degraded silently from a wheel.
      - name: Installed-wheel smoke (distribution integrity)
        working-directory: python
        run: python3 scripts/wheel_smoke.py

  # Everything that needs `require "openstudio"`. The image carries the SDK and
  # the openstudio CLI, so the EnergyPlus-dependent suites run rather than skip.
  # ~24 of every run's ~26 billed minutes are this matrix + verify (the
  # nrel/openstudio container jobs). They run on pushes to MAIN and on manual
  # dispatch — not on every PR push, which was burning ~26 min per push against
  # the org's shared 3000-minute allowance. PR pushes get the bare-runner lint
  # (~20 s); run the full matrix on a PR when it matters with:
  #   gh workflow run test.yml --ref <branch>
  test:
    if: github.event_name != 'pull_request'
    # vars.CI_RUNNER unset -> GitHub-hosted (billed minutes). Set it to the
    # CodeBuild PROJECT NAME (necb-ci) and these jobs run on the AWS account
    # instead — ZERO GitHub-hosted minutes, same Actions UI. Deleting the
    # variable reverts instantly; no workflow edit either way. The per-run
    # label is composed HERE: expressions stored inside a variable are never
    # re-expanded, so the variable must hold only the project name.
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    container: nrel/openstudio:3.11.0
    strategy:
      fail-fast: false
      matrix:
        gem:
          - btap-costing
          - btap-modeling
          - btap-necb
          - btap-simulation
    env:
      # btap-necb's thermal-bridging gate (ex-envelope) skips when tbd is missing, and
      # a skipped gate is a green-but-vacuous gate — same reasoning as
      # LEGACY_PIN_REQUIRED on the parity job. With this set, a tbd that failed to
      # install fails the run instead of quietly reducing coverage. Harmless on
      # the other seven legs: only test_thermal_bridging.rb reads it.
      TBD_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      # tbd/osut/topolys are the envelope domain's third-party runtime deps. They
      # are declared in the gemspec, but these suites run under plain `ruby` (not
      # `bundle exec`), so gemspec dependencies are never resolved — they have to
      # be installed explicitly or NECB 3.1.1.7 goes untested.
      #
      # The versions come from legacy_pin/Gemfile.lock, NOT from a constraint
      # here: the parity job runs our code and the oracle together under that
      # lock, so this is what makes the two comparable. Floating them is not a
      # neutral choice — osut 0.9.1 changes generated insulation conductivities,
      # which would show up as a parity flip caused by a library upgrade rather
      # than by our code. openstudio-standards does not solve this for us: it
      # declares `tbd ~> 3`, never mentions osut or topolys, and commits no lock.
      - name: Install the tbd triplet pinned by legacy_pin
        if: matrix.gem == 'btap-necb'
        run: |
          gem install $(ruby legacy_pin/tbd_triplet.rb) --no-document
          ruby -e '
            want = `ruby legacy_pin/tbd_triplet.rb`.strip
            require "tbd"
            got = %w[topolys osut tbd].map { |g| "#{g}:#{Gem.loaded_specs[g]&.version}" }.join(" ")
            abort("::error::tbd triplet is #{got}, expected #{want} (a newer gem is winning over the pin)") if got != want
            puts "tbd triplet matches the pinned oracle: #{got}"
          '
      # `rake test:gem` forks the suite's files instead of running them one at a
      # time. The matrix already parallelizes across GEMS; this parallelizes
      # WITHIN one, which matters because btap-necb and btap-modeling are by far
      # the longest leg and sets the wall-clock and the bill for the whole run.
      #
      # It excludes test_helper.rb and the *_parity.rb suites for the same
      # reasons the loop it replaced did: the first is not a test, and the second
      # needs the pinned oracle and is covered by the `parity` job, where it
      # cannot pass vacuously.
      #
      # JOBS defaults to cores-minus-a-reserve with a floor of 2, so this is a
      # real (if modest) win on a small hosted runner rather than a silent
      # fallback to sequential. Output is suppressed while green and any failing
      # file is re-run serially afterwards, so a failure reads cleanly instead of
      # interleaved with a dozen other suites.
      - name: ${{ matrix.gem }} suite
        run: |
          echo "runner: $(nproc) cores, $(free -m | awk '/Mem:/{print $2}') MB"
          rake "test:gem[${{ matrix.gem }}]"

  # Cross-gem rule verification: the reference transforms must actually
  # overwrite non-compliant proposed values, and the as-applied part-load curves
  # must match the code coefficients.
  verify:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    container: nrel/openstudio:3.11.0
    steps:
      - uses: actions/checkout@v4
      # Doc/TOC/citation duties on the Ruby side; the generation DIRECTION is a lint-job gate.
      - name: "Decisions registry drift (doc <-> decisions.json <-> ruling: tags)"
        run: cd btap-necb && ruby test/test_decisions_registry.rb
      - name: rake necb:verify
        run: rake necb:verify
      # The Python port's FULL suite, in the one place that has everything at
      # once: ruby + the openstudio CLI (the Ruby gems' backend, one half of
      # every cross-language gate) + the bundled EnergyPlus (the engine the
      # Python Local backend spawns). The REQUIRED flags turn every
      # dependency-skip into a failure — this is the job where the
      # cross-language gates must never go vacuous (D-79).
      # No wheel download here: the nrel image ships the SAME 3.11.0 Python
      # bindings at /usr/local/openstudio-3.11.0/Python (identical native lib
      # under both languages — exactly what a cross-language parity run
      # wants), and the bundled EnergyPlus is the engine.
      # Parallel via pytest-xdist (worker processes; the E+-touching suites
      # dominate serial wall time ~10x). The venv exists only to carry
      # pytest — the SDK still comes from the image via PYTHONPATH, so both
      # languages run the identical native lib. Falls back loudly, never
      # silently: every dependency is REQUIRED.
      # The corpus samples are DERIVED artifacts (never committed). The
      # Python suite reads a PYTHON-generated corpus at its Python-owned
      # default location (D-80 R2: no packaging/windows read), so the
      # sample-dependent reference-rules tests run instead of skipping (a
      # skipped gate is green-but-vacuous). The matrix step below generates
      # the Ruby corpus separately via run_corpus --samples-gen.
      - name: Generate the sample corpus (Python)
        run: |
          PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python" \
            python3 python/scripts/generate_samples.py python/tests/generated/samples
      # M7: BOTH engines, both pinned — the Ruby tbd triplet (the frozen
      # oracle baseline) and py-tbd's tbd-3.5.2-compat SHA — so the direct
      # Ruby-vs-Python TBD process-parity gate and the assembled Leg-B
      # thermal-bridging case run here rather than skip.
      - name: Install the pinned tbd triplet (Ruby) + py-tbd (Python)
        working-directory: python
        run: |
          gem install $(ruby ../legacy_pin/tbd_triplet.rb) --no-document
          # librsvg2-bin: the floor-plan raster test needs an SVG rasterizer
          # on PATH; supplied here (M8) so it RUNS instead of skipping, and
          # BTAP_RASTERIZER_REQUIRED below keeps it from ever going vacuous.
          apt-get update -qq && apt-get install -y -qq python3-venv librsvg2-bin > /dev/null
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q pytest pytest-xdist
          # py-tbd itself with --no-deps: its openstudio requirement would
          # pull the PyPI wheel into the venv and SHADOW the image SDK this
          # job's premise is built on (venv site-packages beat PYTHONPATH).
          # Every other dep is pure Python; the py-topolys SHA mirrors the
          # pin inside py-tbd's own pyproject.
          .ci-venv/bin/pip install -q "oslg==0.4.0" "osut==0.9.1" "jsonschema>=4" \
            "py-topolys @ git+https://github.com/canmet-energy/py-topolys.git@364703051cb27fbe6a686f9764a996389bd0ad73"
          .ci-venv/bin/pip install -q --no-deps "$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['optional-dependencies']['tbd'][0])")"
      - name: Python suites, everything required (cross-language gates included)
        working-directory: python
        run: |
          # (.ci-venv was built in the tbd install step above — pytest,
          # pytest-xdist and the pinned py-tbd already live in it.)
          # FULL_MATRIX=1: the D-58 reference-selection matrix defaults to a
          # 22-system subset for PR speed. The M5 acceptance claim is about
          # all 97, so the claim is enforced HERE rather than resting on a
          # manual run someone did once.
          PYTHONPATH=/usr/local/openstudio-3.11.0/Python \
          BTAP_ENERGYPLUS=/usr/local/openstudio-3.11.0/EnergyPlus/energyplus \
          BTAP_SDK_REQUIRED=1 BTAP_ENGINE_REQUIRED=1 BTAP_TBD_REQUIRED=1 TBD_REQUIRED=1 \
          BTAP_RASTERIZER_REQUIRED=1 BTAP_SAMPLES_REQUIRED=1 FULL_MATRIX=1 \
            .ci-venv/bin/pytest -n auto -q tests/
      # The M6 decisive acceptance, continuously enforced: the Ruby CLI and
      # the PYTHON CLI over the same corpus, every pair diffed under the
      # Leg-B rules (verification/spec.json). Tier none covers all 18 models
      # (the full reference-transform + rules surface); tier sizing runs the
      # 3-model subset through real EnergyPlus on BOTH backends. The annual
      # --quick tier lives in the dispatch-only parity job (it is the
      # expensive one, like everything else there).
      # D-80 R4 (D-82): the frozen verify-lane scenarios REPLACED the live
      # Leg-B generator-CLI matrix here — the drivers are dormant
      # (BTAP_LEGB=1 reactivates for archaeology), deleted at R6.
      - name: Frozen scenarios (verify lane)
        working-directory: python
        run: |
          PYTHONPATH="/usr/local/openstudio-3.11.0/Python" \
          BTAP_ENERGYPLUS=/usr/local/openstudio-3.11.0/EnergyPlus/energyplus \
          BTAP_SCENARIO_LANES=verify BTAP_SCENARIOS_REQUIRED=1 \
            .ci-venv/bin/pytest -q tests/necb/test_frozen_scenarios.py -p no:cacheprovider

  # The legacy-parity gates, against the PINNED oracle revision.
  #
  # LEGACY_PIN_REQUIRED=1 is not optional here: without it a missing oracle
  # SKIPS, and a skipped parity gate is green-but-vacuous — it would report
  # success while comparing against nothing.
  #
  # Cloning the fork is the expensive part, so the bundle is cached on
  # legacy_pin/REF + Gemfile.lock. Not run on every push.
  parity:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    container: nrel/openstudio:3.11.0
    env:
      LEGACY_PIN_REQUIRED: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/legacy_pin/Gemfile
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned oracle
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: legacy-pin-${{ hashFiles('legacy_pin/REF', 'legacy_pin/Gemfile.lock') }}
      - name: Bundle the oracle
        run: bundle install
      # Listed explicitly rather than globbed *_parity.rb: three of the eleven
      # gates (the two test_data_integrity.rb, and lighting's test_costing.rb)
      # carry pin-dependent tests under names a glob would miss, and they would
      # then only ever run in their skipping form.
      - name: Parity gates
        run: |
          status=0
          for t in \
            btap-necb/test_envelope_lookup_parity.rb \
            btap-necb/test_envelope_prescriptive_parity.rb \
            btap-necb/test_envelope_costing_parity.rb \
            btap-necb/test_envelope_data_integrity.rb \
            btap-necb/test_loads_schedules_parity.rb \
            btap-necb/test_loads_apply_parity.rb \
            btap-necb/test_loads_data_integrity.rb \
            btap-necb/test_shw_shw_parity.rb \
            btap-necb/test_lighting_lights_parity.rb \
            btap-necb/test_lighting_daylighting_parity.rb \
            btap-necb/test_lighting_costing.rb \
            btap-necb/test_oracle_goldens_current.rb \
          ; do
            gem_dir="${t%%/*}"; file="${t##*/}"
            echo "::group::$t"
            (cd "$gem_dir" && bundle exec ruby "test/$file") || status=1
            echo "::endgroup::"
          done
          exit $status
      # LIVE Leg C (D-80 R1): Python vs the LIVE pinned oracle across ALL
      # golden groups — python-prep / ruby-probe, the committed-goldens
      # freshness comparison, then the five goldens test files against the
      # fresh export with ZERO skips asserted. This superseded the M8
      # single-value lighting gate. It lives here because this is the ONLY
      # job that bundles the oracle. D-78 terminology: Leg A is RUBY vs the
      # oracle (the gates above); PYTHON vs the oracle is Leg C, whether
      # frozen or, as here, live.
      - name: Live Leg C (python-prep / ruby-probe, all golden groups)
        run: |
          apt-get update -qq && apt-get install -y -qq python3-venv > /dev/null
          python3 -m venv python/.parity-venv
          python/.parity-venv/bin/pip install -q pytest
          export PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python"
          BTAP_PYTHON="$PWD/python/.parity-venv/bin/python" \
            bash verification/live_leg_c.sh /tmp/live-leg-c
      # D-80 R4 (D-82): the frozen ANNUAL scenarios are the parity job's
      # pipeline gate (they replaced the live annual Leg-B steps). This
      # step was accidentally swallowed by the PR-2 step-removal edit —
      # the post-merge review caught the two annual scenarios inactive;
      # test_ci_wires_every_lane now pins each lane to a CI executor.
      - name: Frozen scenarios (parity lane)
        working-directory: python
        env:
          BUNDLE_GEMFILE: ''
        run: |
          PYTHONPATH="/usr/local/openstudio-3.11.0/Python" \
          BTAP_ENERGYPLUS=/usr/local/openstudio-3.11.0/EnergyPlus/energyplus \
          BTAP_SCENARIO_LANES=parity BTAP_SCENARIOS_REQUIRED=1 \
            .parity-venv/bin/python -m pytest -q tests/necb/test_frozen_scenarios.py -p no:cacheprovider
      # Leg-C golden export (D-78/D-80): the pin bundle lives HERE, so this
      # is how goldens are (re)generated — dispatch with export_goldens=true,
      # download the artifact into verification/oracle/goldens/, commit. Run
      # it whenever legacy_pin/REF bumps; test_oracle_goldens_current.rb
      # fails loudly until the re-exported goldens are committed. Reuses the
      # live-Leg-C stages: --canonical prep (refuses a dirty tree), then the
      # completeness-gated atomic export at the committed location.
      - name: Export the oracle goldens
        if: inputs.export_goldens
        run: |
          export PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python"
          python3 python/scripts/oracle_prep.py --out /tmp/oracle-prep --canonical
          bundle exec ruby verification/oracle/export_goldens.rb \
            --prep /tmp/oracle-prep --out verification/oracle/goldens
      - uses: actions/upload-artifact@v4
        if: inputs.export_goldens
        with:
          name: oracle-goldens
          path: verification/oracle/goldens/
          retention-days: 7
          if-no-files-found: error
