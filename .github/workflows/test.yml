name: test

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      export_goldens:
        description: 'Also export the Leg-C oracle goldens as an artifact (D-78)'
        type: boolean
        default: false

# A superseded run is pure waste: pushing twice to a PR used to bill both runs
# in full. Cancel the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep generated reports, the decisions document, and the surviving legacy
# oracle scripts on an explicit UTF-8 locale in every lane.
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  # Stdlib-only Python checks run on a bare runner and fail fast before any
  # OpenStudio SDK or EnergyPlus work.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install fast-lane test runner
        run: pip install -q pytest
      - name: Rule-key orphan lint
        run: python3 python/scripts/necb_orphan_keys.py
      # The coverage manifests' code refs ("where is this sentence dealt with")
      # are pure Python file reads. A rename that strands a pointer should fail
      # before anything pays for the container.
      - name: Coverage code refs resolve
        run: cd python && pytest -q tests/test_coverage_code_refs.py
      # NECB_COVERAGE.md and NECB_8_4_COVERAGE.html are GENERATED from the
      # gems' article_coverage manifests, and they are what an AHJ reads. Nothing
      # made the committed copies track the manifests, so they drifted: an
      # article promoted partial -> implemented (8.4.4.12 economizers, D-62) kept
      # showing as a gap. Regenerate and demand a clean tree — same contract the
      # decisions registry gets, in the direction a doc can silently rot.
      #
      # Both generators are stdlib-only Python, so they belong here rather than
      # in the container. They are deterministic ONLY because the branch is a
      # literal — do not restore `git rev-parse` in generate_necb_8_4_coverage.py
      # or this check fails on every branch that is not main.
      - name: Coverage docs match the manifests
        run: |
          python3 python/scripts/generate_necb_coverage.py
          python3 python/scripts/generate_necb_8_4_coverage.py
          git diff --exit-code -- docs/NECB_COVERAGE.md \
                                  docs/NECB_8_4_COVERAGE.html \
            || { echo "::error::Coverage docs are stale. Run: rake necb:coverage_doc"; exit 1; }
      # The Python registry is canonical after R6. Run its document, TOC, id,
      # and runtime-citation gates explicitly; the retired Ruby-copy sync test
      # is intentionally not part of this lane.
      - name: "Decisions registry: document + TOC + runtime citations"
        run: |
          python3 python/scripts/generate_decisions_toc.py --check
          cd python && python3 -m unittest \
            tests.necb.test_decisions_registry_sync.TestDecisionsRegistrySync.test_decision_ids_are_unique_and_well_formed \
            tests.necb.test_decisions_registry_sync.TestDecisionsRegistrySync.test_doc_headings_mirror_the_canonical_registry \
            tests.necb.test_decisions_registry_sync.TestDecisionsRegistrySync.test_doc_toc_matches_the_canonical_registry \
            tests.necb.test_decisions_registry

  # The Python product suite on a bare runner, including import contracts,
  # linting, the installable wheel, and the engine-free frozen scenarios. The
  # EnergyPlus-dependent tests skip here; verify supplies the full runtime.
  python:
    # Same AWS switch as the container jobs. This job is no longer the ~40 s
    # it was at M1: the wheel gate, ruff and the full suite put it near six
    # minutes, and on a private repo those are BILLED GitHub minutes. With
    # vars.CI_RUNNER set it runs on CodeBuild instead; unset reverts to
    # GitHub-hosted with no workflow edit. No `container:` here on purpose —
    # the point of this job is a bare environment that installs the wheel.
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # the project floor; local dev may be newer
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install the openstudio wheel + test runner
        run: pip install -q 'openstudio~=3.11.0' pytest pytest-xdist import-linter ruff build
      # The Python thermal-bridging engine is required on the bare runner too.
      - name: Install the pinned py-tbd engine (the [tbd] extra)
        working-directory: python
        # py-tbd from its released v3.5.2 tag (exactly the version the
        # pyproject ==3.5.2 pin names) until the PyPI publication lands;
        # the release checklist flips this to the plain PyPI install.
        run: |
          pip install -q "canmet-tbd==3.5.2"
      # The D-77 dependency arrows as an enforced contract, not a convention:
      # necb -> costing -> modeling -> audit, simulation beside, and audit
      # SDK-free (the property the bare-runner audit suite depends on). It
      # has already caught real drift — a lazily-imported SDK helper that had
      # crept into the stdlib-only _compat module.
      - name: Import contracts (D-77 direction, audit SDK-free)
        working-directory: python
        run: lint-imports
      # pytest-xdist runs test files in parallel worker PROCESSES (the same
      # per-file forking the Ruby Rakefile does) — the suites are stdlib
      # unittest classes, collected by pytest unchanged; plain
      # `python3 -m unittest discover tests` remains the zero-install way.
      - name: Ruff (the lint policy in pyproject is enforced, not decorative)
        working-directory: python
        run: ruff check .
      - name: Python suites (SDK required, engine tests skip here)
        working-directory: python
        env:
          BTAP_SDK_REQUIRED: '1'
          BTAP_TBD_REQUIRED: '1'
          # D-80 R4: the frozen-scenario python lane (default) rides this
          # pytest run; missing baselines are a FAILURE, never a skip.
          BTAP_SCENARIOS_REQUIRED: '1'
        run: pytest -n auto -q tests/
      # Distribution integrity. The suites above run against the CHECKOUT,
      # where every data file exists because the repo exists; a wheel is a
      # different artifact. This builds one, installs it into a clean venv,
      # and exercises it from OUTSIDE the checkout so the source tree cannot
      # shadow the install. It exists because catalog_html() once resolved
      # its seed model outside the package and degraded silently from a wheel.
      - name: Installed-wheel smoke (distribution integrity)
        working-directory: python
        run: python3 scripts/wheel_smoke.py

  # Full Python rule verification in the OpenStudio image. EnergyPlus, the SDK,
  # rasterizer, generated sample corpus, and thermal-bridging dependencies are
  # all required here so dependency skips cannot pass vacuously.
  verify:
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    container: nrel/openstudio:3.11.0
    steps:
      - uses: actions/checkout@v5
      # The container runs as root while the workspace belongs to the runner
      # user, so git refuses the tree ("dubious ownership", exit 128) — which
      # surfaces far from the cause: oracle_prep's `git rev-parse HEAD` and the
      # self-containment scanner's `git ls-files` die, not git itself. Harmless
      # where the UIDs already match.
      - name: Trust the workspace (container UID != workspace owner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The full Python suite runs where the SDK and bundled EnergyPlus are
      # available. REQUIRED flags turn each supported dependency skip into a
      # failure.
      # No wheel download here: the nrel image ships the SAME 3.11.0 Python
      # bindings at /usr/local/openstudio-3.11.0/Python (identical native lib
      # loaded by the image), and the bundled EnergyPlus is the engine.
      # Parallel via pytest-xdist (worker processes; the E+-touching suites
      # dominate serial wall time ~10x). The venv exists only to carry
      # pytest — the SDK still comes from the image via PYTHONPATH, so both
      # languages run the identical native lib. Falls back loudly, never
      # silently: every dependency is REQUIRED.
      # The corpus samples are DERIVED artifacts (never committed). The
      # Python suite reads a PYTHON-generated corpus at its Python-owned
      # default location (D-80 R2: no packaging/windows read), so the
      # sample-dependent reference-rules tests run instead of skipping.
      - name: Generate the sample corpus (Python)
        run: |
          PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python" \
            python3 python/scripts/generate_samples.py python/tests/generated/samples
      # Install only the Python thermal-bridging stack. The legacy Ruby bundle
      # is isolated to the parity job where the oracle still needs it.
      - name: Install Python test and thermal-bridging dependencies
        working-directory: python
        run: |
          # librsvg2-bin: the floor-plan raster test needs an SVG rasterizer
          # on PATH; supplied here (M8) so it RUNS instead of skipping, and
          # BTAP_RASTERIZER_REQUIRED below keeps it from ever going vacuous.
          apt-get update -qq && apt-get install -y -qq python3-venv librsvg2-bin > /dev/null
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install -q pytest pytest-xdist
          # py-tbd itself with --no-deps: its openstudio requirement would
          # pull the PyPI wheel into the venv and SHADOW the image SDK this
          # job's premise is built on (venv site-packages beat PYTHONPATH).
          # Every other dep is pure Python; the py-topolys SHA mirrors the
          # pin inside py-tbd's own pyproject.
          .ci-venv/bin/pip install -q "oslg==0.4.0" "osut==0.9.1" "jsonschema>=4" \
            "py-topolys==0.1.0"
          .ci-venv/bin/pip install -q --no-deps "canmet-tbd==3.5.2"
      - name: Python NECB rule verification
        run: |
          PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python" \
          BTAP_PYTHON="$PWD/python/.ci-venv/bin/python" rake necb:verify
      - name: Python suites, everything required
        working-directory: python
        run: |
          # (.ci-venv was built in the tbd install step above — pytest,
          # pytest-xdist and the pinned py-tbd already live in it.)
          # FULL_MATRIX=1: the D-58 reference-selection matrix defaults to a
          # 22-system subset for PR speed. The M5 acceptance claim is about
          # all 97, so the claim is enforced HERE rather than resting on a
          # manual run someone did once.
          PYTHONPATH=/usr/local/openstudio-3.11.0/Python \
          BTAP_ENERGYPLUS=/usr/local/openstudio-3.11.0/EnergyPlus/energyplus \
          BTAP_SDK_REQUIRED=1 BTAP_ENGINE_REQUIRED=1 BTAP_TBD_REQUIRED=1 \
          BTAP_RASTERIZER_REQUIRED=1 BTAP_SAMPLES_REQUIRED=1 FULL_MATRIX=1 \
            .ci-venv/bin/pytest -n auto -q tests/
      # The verify-lane frozen scenarios preserve the adjudicated R4 behavior
      # after retirement of the live cross-language product drivers.
      - name: Frozen scenarios (verify lane)
        working-directory: python
        run: |
          PYTHONPATH="/usr/local/openstudio-3.11.0/Python" \
          BTAP_ENERGYPLUS=/usr/local/openstudio-3.11.0/EnergyPlus/energyplus \
          BTAP_SCENARIO_LANES=verify BTAP_SCENARIOS_REQUIRED=1 \
            .ci-venv/bin/pytest -q tests/necb/test_frozen_scenarios.py -p no:cacheprovider

  # The legacy-parity gates, against the PINNED oracle revision.
  #
  # LEGACY_PIN_REQUIRED=1 is not optional here: without it a missing oracle
  # SKIPS, and a skipped parity gate is green-but-vacuous — it would report
  # success while comparing against nothing.
  #
  # Cloning the fork is the expensive part, so the bundle is cached on
  # legacy_pin/REF + Gemfile.lock. Not run on every push.
  # Dispatch-only, and the condition says exactly that: this workflow declares
  # no schedule trigger, so an `|| github.event_name == 'schedule'` clause here
  # would be text that can never be true — and dead condition text is how a
  # reader comes to believe parity runs on a timer when nothing runs it.
  parity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER != '' && format('codebuild-{0}-{1}-{2}', vars.CI_RUNNER, github.run_id, github.run_attempt) || 'ubuntu-latest' }}
    container: nrel/openstudio:3.11.0
    env:
      LEGACY_PIN_REQUIRED: '1'
      BUNDLE_GEMFILE: ${{ github.workspace }}/legacy_pin/Gemfile
    steps:
      - uses: actions/checkout@v5
      # The container runs as root while the workspace belongs to the runner
      # user, so git refuses the tree ("dubious ownership", exit 128) — which
      # surfaces far from the cause: oracle_prep's `git rev-parse HEAD` and the
      # self-containment scanner's `git ls-files` die, not git itself. Harmless
      # where the UIDs already match.
      - name: Trust the workspace (container UID != workspace owner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache the pinned oracle
        uses: actions/cache@v5
        with:
          path: vendor/bundle
          key: legacy-pin-${{ hashFiles('legacy_pin/REF', 'legacy_pin/Gemfile.lock') }}
      - name: Bundle the oracle
        run: bundle install
      # Whole-building Python pipeline against the surviving pinned oracle.
      - name: Pinned NECB2020 SmallOffice whole-building gate (Python)
        run: |
          apt-get update -qq && apt-get install -y -qq python3-venv > /dev/null
          python3 -m venv python/.archetype-venv
          python/.archetype-venv/bin/pip install -q pytest
          PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python" \
          BTAP_ENERGYPLUS=/usr/local/openstudio-3.11.0/EnergyPlus/energyplus \
          LEGACY_PIN_REQUIRED=1 \
            python/.archetype-venv/bin/python -m pytest -q \
              python/tests/necb/test_legacy_archetype_e2e.py
      # LIVE Leg C (D-80 R1): Python vs the LIVE pinned oracle across ALL
      # golden groups — python-prep / ruby-probe, the committed-goldens
      # freshness comparison, then the five goldens test files against the
      # fresh export with ZERO skips asserted. It lives here because this is
      # the only job that bundles the oracle. Python vs the oracle is Leg C,
      # whether frozen or, as here, live.
      - name: Live Leg C (python-prep / ruby-probe, all golden groups)
        run: |
          python3 -m venv python/.parity-venv
          python/.parity-venv/bin/pip install -q pytest
          export PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python"
          BTAP_PYTHON="$PWD/python/.parity-venv/bin/python" \
            bash verification/live_leg_c.sh /tmp/live-leg-c
      # The frozen annual scenarios are the parity job's pipeline gate.
      # test_ci_wires_every_lane pins each declared lane to a CI executor.
      - name: Frozen scenarios (parity lane)
        working-directory: python
        env:
          BUNDLE_GEMFILE: ''
        run: |
          PYTHONPATH="/usr/local/openstudio-3.11.0/Python" \
          BTAP_ENERGYPLUS=/usr/local/openstudio-3.11.0/EnergyPlus/energyplus \
          BTAP_SCENARIO_LANES=parity BTAP_SCENARIOS_REQUIRED=1 \
            .parity-venv/bin/python -m pytest -q tests/necb/test_frozen_scenarios.py -p no:cacheprovider
      # Leg-C golden export (D-78/D-80): the pin bundle lives HERE, so this
      # is how goldens are (re)generated — dispatch with export_goldens=true,
      # download the artifact into verification/oracle/goldens/, commit. Run
      # it whenever legacy_pin/REF bumps. The Python currentness and live Leg-C
      # gates fail until re-exported goldens are committed. Reuses the live
      # Leg-C stages: --canonical prep (refuses a dirty tree), then the
      # completeness-gated atomic export at the committed location.
      - name: Export the oracle goldens
        if: inputs.export_goldens
        run: |
          export PYTHONPATH="$PWD/python:/usr/local/openstudio-3.11.0/Python"
          python3 python/scripts/oracle_prep.py --out /tmp/oracle-prep --canonical
          bundle exec ruby verification/oracle/export_goldens.rb \
            --prep /tmp/oracle-prep --out verification/oracle/goldens
      - uses: actions/upload-artifact@v6
        if: inputs.export_goldens
        with:
          name: oracle-goldens
          path: verification/oracle/goldens/
          retention-days: 7
          if-no-files-found: error
