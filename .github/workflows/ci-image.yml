name: ci-image

# Builds infra/ci-image/Dockerfile and publishes it to GHCR under a
# content-addressed tag: <openstudio version>-<first 12 hex of the Dockerfile's
# sha256>. test.yml pins that exact tag (python/tests/test_ci_image_pin.py
# enforces the match), so a Dockerfile change publishes a NEW tag and CI moves
# only when test.yml moves with it. An existing tag is never overwritten.
#
# Runs on a GitHub-hosted runner: it needs a Docker daemon and nothing else,
# and GitHub-hosted minutes are free for this public repository.
on:
  push:
    paths:
      - 'infra/ci-image/**'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and publish the content-addressed tag
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOCKERFILE=infra/ci-image/Dockerfile
          VERSION=$(sed -n 's|^FROM nrel/openstudio:\([0-9.]*\).*|\1|p' "$DOCKERFILE")
          TAG="${VERSION}-$(sha256sum "$DOCKERFILE" | cut -c1-12)"
          IMAGE="ghcr.io/canmet-energy/btap-ci:${TAG}"
          echo "image: ${IMAGE}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "${IMAGE} is already published; content-addressed tags are never overwritten"
            exit 0
          fi
          docker build -t "$IMAGE" infra/ci-image
          docker push "$IMAGE"
          echo "### Published \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

  # The CodeBuild runners pull from ECR in their own region instead of GHCR
  # (~50 s per container job otherwise). This copies the exact GHCR image, so
  # both registries serve identical content under the same tag. It runs ON a
  # CodeBuild runner because the project's service role is what may push to
  # the btap-ci repository (infra/aws-ci/README.md); without CI_RUNNER there
  # is nothing to mirror for.
  mirror-to-ecr:
    needs: publish
    if: vars.CI_RUNNER != ''
    runs-on: ${{ fromJSON(format('["codebuild-{0}-{1}-{2}","buildspec-override:true"]', vars.CI_RUNNER, github.run_id, github.run_attempt)) }}
    steps:
      - uses: actions/checkout@v5
      - name: Copy the tag into ECR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOCKERFILE=infra/ci-image/Dockerfile
          VERSION=$(sed -n 's|^FROM nrel/openstudio:\([0-9.]*\).*|\1|p' "$DOCKERFILE")
          TAG="${VERSION}-$(sha256sum "$DOCKERFILE" | cut -c1-12)"
          REGISTRY=765017559068.dkr.ecr.ca-central-1.amazonaws.com
          if aws ecr describe-images --region ca-central-1 --repository-name btap-ci \
               --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "$REGISTRY/btap-ci:${TAG} is already mirrored"
            exit 0
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          aws ecr get-login-password --region ca-central-1 \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "ghcr.io/canmet-energy/btap-ci:${TAG}"
          docker tag "ghcr.io/canmet-energy/btap-ci:${TAG}" "$REGISTRY/btap-ci:${TAG}"
          docker push "$REGISTRY/btap-ci:${TAG}"
          echo "### Mirrored \`$REGISTRY/btap-ci:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
