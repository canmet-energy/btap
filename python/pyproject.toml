[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canmet-btap"  # PyPI similarity check blocks "btap" (bta exists); the import stays `btap`
version = "0.2.0"
description = "NECB 2020/2025 Part 8 performance-path compliance toolchain (Python port of the btap gem family)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
# The SDK: same SWIG layer as the Ruby gems, published on PyPI by NREL.
# btap.audit needs none of it; simulation/modeling/costing/necb do.
# btap-energyplus (R5, D-83): the pinned EnergyPlus engine as package
# data — a HARD platform-marked EXACT pin, so `pip install btap` needs no
# engine thought on the supported platforms (Windows x86-64; glibc-2.35+
# Linux x86-64 — the floor the companion's build-time auditwheel gate
# enforces on every build; see packaging/pypi/energyplus). Exact
# (==25.2.0.2, never
# .*): a companion repackaging REQUIRES a corresponding btap release.
# Other platforms skip the marker and fall to the provisioner's
# override/archive/download rungs.
dependencies = [
  "openstudio~=3.11.0",
  "btap-energyplus==25.2.0.2 ; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

# NECB 3.1.1.7 thermal bridging (M7, D-79 Option A): py-tbd's
# tbd-3.5.2-compat branch — the revision verified against the SAME Ruby
# TBD 3.5.2 / OSut 0.8.2 oracle baseline the family is frozen on (py-tbd
# main ports 3.6.0, a physically different uprate). Pinned by COMMIT SHA on
# both py-tbd and (transitively, inside py-tbd's own pyproject) py-topolys:
# neither has a tagged release yet, and an unpinned git ref would let the
# verification baseline move without a commit here.
# tests/necb/test_envelope_thermal_bridging.py asserts the installed engine
# identity; BTAP_TBD_REQUIRED=1 turns its absence from a skip into a failure.
[project.optional-dependencies]
# Released pin since R5 (D-83): canmet-tbd 3.5.2 (PyPI blocked the py-tbd
# name as too similar to pytbd/tbd) IS the pinned verification
# tree bfb23e6 plus one diff-proven metadata-only commit (its v3.5.2
# tag), published from canmet-energy/py-tbd; py-topolys==0.1.0 rides
# transitively (its v0.1.0 tag sits at exactly the D-79 pinned SHA).
# The Option A pin discipline survives publication as exact == pins.
tbd = ["canmet-tbd==3.5.2"]

[project.scripts]
btap-compliance = "btap.necb.cli:main"

[tool.setuptools.packages.find]
include = ["btap*"]

# The rules/catalog/cost tables are the product, not incidental assets: every
# domain reads them by path at runtime, so a wheel without them fails on the
# first call. setuptools ships only .py by default — verified by building one
# and finding zero data files in it. Keep this in step with any new data dir.
#
# The costing CSVs here are the PLACEHOLDER schema copies (source column:
# placeholder/custom/industry — never RS-Means), and they DO belong in the
# wheel: a wheel is the analogue of the Ruby GEM, whose spec.files ships
# them, not of the Windows INSTALLER, which strips them via the Rakefile's
# PRICED_CSVS. Anyone building an end-user Python installer later should
# mirror that exclusion there, not here. Real RS-Means values are
# runtime-injected (costs_csv= / BTAP_COSTING_DIR) and never live in the tree.
[tool.setuptools.package-data]
"*" = ["data/**/*.json", "data/**/*.csv", "data/**/*.md", "data/**/*.osm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforced in CI, so the selection is what this codebase can honestly hold:
#   E4/E7/E9 + F + B + I — real defects, bugbear traps, import hygiene.
# Deliberately NOT enabled:
#   E501 (line length) — the port mirrors Ruby's line structure; reflowing
#     ~745 lines would bury the port diff in noise for no defect caught.
#   UP  (pyupgrade)    — it rewrites %-formatting to f-strings, and the
#     audit narrative's "[%-8s] %-13s %s" is deliberate BYTE-PARITY with
#     Ruby's format(). Auto-modernizing it would silently break the report's
#     case-sensitive checklist parsing.
select = ["E4", "E7", "E9", "F", "B", "I"]
# Ruby's Array#zip PADS the shorter side with nil; Python's zip truncates and
# strict=True raises. Neither matches, and the ported code handles length
# mismatch explicitly where it matters — a blanket strict= would diverge.
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The D-77 one-way dependency arrows, enforced in-package (one distribution,
# five subpackages): necb -> costing -> modeling -> audit; simulation beside.
[tool.importlinter]
root_package = "btap"
# Required because the audit contract forbids an EXTERNAL module (openstudio).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "family dependency direction (D-77)"
type = "layers"
layers = ["btap.necb", "btap.costing", "btap.modeling", "btap.audit"]

[[tool.importlinter.contracts]]
name = "simulation depends only on audit"
type = "forbidden"
source_modules = ["btap.simulation"]
forbidden_modules = ["btap.modeling", "btap.costing", "btap.necb"]

[[tool.importlinter.contracts]]
name = "audit is SDK-free and bottom of the family"
type = "forbidden"
source_modules = ["btap.audit"]
forbidden_modules = ["openstudio", "btap.simulation", "btap.modeling", "btap.costing", "btap.necb"]
